[package]
name = "agave-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
toml = "1"
async-trait = "0.1"
base64 = "0.23"
rand = "0.10"
sha2 = "0.11"
libc = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
