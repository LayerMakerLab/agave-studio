# Model registry for the Agave Studio gateway. Loaded at startup.
#
# id        our id, served to the web app. Format "<provider>/<slug>".
# endpoint  the provider's own model id (fal endpoint path, Replicate owner/name, Gemini model, etc.).
# key       env name of the key slot (see config/keys.example.env).
# verified  true only when the endpoint id was confirmed on the provider's official docs page.
#           false means check it with a live call before relying on it.
#           Verified does not cover request-body fields; those are noted per entry.
# params    aspect / duration / resolution choices shown to the user. Empty list means not applicable.
# price     provider list price in USD per "second" of video or per "image", shown in the app as an estimate
#           of what a job costs on your own key. `usd` is the default and must be the highest rate;
#           by_resolution overrides it.
#
# Adapters exist for: fal, replicate, gemini (veo + image), openai (image), bfl, elevenlabs, meshy, comfy (your own
# ComfyUI through comfy-api-proxy; `endpoint` names a built-in workflow in providers.rs, `key` is its address).

